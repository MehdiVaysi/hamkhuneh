<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
width:320px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2e8b57;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}

p{
text-align:center;
margin-top:15px;
}

a{
text-decoration:none;
color:#2e8b57;
}
</style>

</head>

<body>

<div class="box">

<h1>ورود</h1>

<input type="tel" placeholder="شماره موبایل">

<input type="password" placeholder="رمز عبور">

<button>ورود</button>

<p>
حساب ندارید؟
<a href="register.html">ثبت‌نام</a>
</p>

</div>

</body>
  </html>
