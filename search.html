<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جستجوی آگهی‌ها | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
padding:30px;
display:flex;
justify-content:center;
}

.box{
background:white;
width:380px;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#2e8b57;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-family:tahoma;
}

button{
width:100%;
padding:12px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}

.result{
margin-top:20px;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
background:#fafafa;
}
</style>

</head>

<body>

<div class="box">

<h2>جستجوی آگهی‌ها</h2>

<input type="text" placeholder="شهر">

<select>
<option>نوع آگهی</option>
<option>همخانه</option>
<option>خانه</option>
</select>

<input type="number" placeholder="حداکثر بودجه">

<button>جستجو</button>

<div class="result">
<strong>نمونه نتیجه</strong><br>
تهران - همخانه - بودجه ۸٬۰۰۰٬۰۰۰ تومان
</div>

</div>

</body>
</html>
