<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام‌ها | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
display:flex;
justify-content:center;
padding:30px;
}

.box{
background:white;
width:380px;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#2e8b57;
margin-bottom:20px;
}

.chat{
height:300px;
border:1px solid #ddd;
border-radius:10px;
padding:10px;
overflow-y:auto;
background:#fafafa;
}

.me{
background:#2e8b57;
color:white;
padding:8px 12px;
border-radius:10px;
margin:8px 0;
display:inline-block;
}

.other{
background:#e5e5e5;
padding:8px 12px;
border-radius:10px;
margin:8px 0;
display:inline-block;
}

input{
width:100%;
padding:10px;
margin-top:15px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}
</style>

</head>

<body>

<div class="box">

<h2>پیام‌ها</h2>

<div class="chat">
<div class="other">سلام، آگهی هنوز فعال است؟</div><br>
<div class="me">سلام، بله هنوز فعال است.</div>
</div>

<input type="text" placeholder="پیام خود را بنویسید...">

<button>ارسال پیام</button>

</div>

</body>
</html>
