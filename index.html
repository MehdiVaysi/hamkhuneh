<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همخونه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🏠 همخونه</h1>

    <p>پلتفرم هوشمند برای پیدا کردن همخونه و خانه در ایران</p>

    <button>🔍 پیدا کردن همخونه</button>
    <br><br>

    <button>🏡 پیدا کردن خانه</button>
    <br><br>

    <button>🏠 ثبت خانه برای اجاره</button>
    <br><br>

    <button>🧹 تقسیم کارهای خانه</button>

    <hr>

    <h2>📝 ثبت آگهی</h2>

    <p>اگر به دنبال همخونه هستید یا خانه‌ای برای اجاره دارید، آگهی خود را ثبت کنید.</p>

    <button>📢 ثبت آگهی جدید</button>

    <hr>

    <h2>🔐 ورود کاربران</h2>

    <input type="text" placeholder="شماره موبایل یا ایمیل">
    <br><br>

    <input type="password" placeholder="رمز عبور">
    <br><br>

    <button>ورود</button>

    <p><a href="#">ثبت‌نام</a></p>

    <p><a href="#">رمز عبور را فراموش کرده‌ام</a></p>

</body>
</html>
