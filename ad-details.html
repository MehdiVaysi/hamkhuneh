<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات آگهی | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
display:flex;
justify-content:center;
padding:30px;
}

.box{
background:white;
width:380px;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

.photo{
width:100%;
height:200px;
background:#ddd;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
color:#666;
margin-bottom:20px;
}

h2{
color:#2e8b57;
margin-bottom:10px;
}

.info{
margin:8px 0;
color:#444;
}

.desc{
margin-top:15px;
padding:12px;
background:#fafafa;
border-radius:8px;
line-height:1.8;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}
</style>

</head>

<body>

<div class="box">

<div class="photo">
تصویر آگهی
</div>

<h2>آگهی نمونه همخونه</h2>

<div class="info">📍 شهر: تهران</div>

<div class="info">💰 بودجه: ۸٬۰۰۰٬۰۰۰ تومان</div>

<div class="info">👤 جنسیت: آقا</div>

<div class="info">🎂 سن: ۲۸ سال</div>

<div class="desc">
اینجا توضیحات کامل آگهی نمایش داده می‌شود و کاربر می‌تواند اطلاعات بیشتری درباره خانه یا همخانه مشاهده کند.
</div>

<button>تماس با آگهی‌دهنده</button>

</div>

</body>
</html>
