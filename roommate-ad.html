<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت آگهی همخانه | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.box{
background:white;
width:360px;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#2e8b57;
}

input,select,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-family:tahoma;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:12px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}
</style>

</head>

<body>

<div class="box">

<h2>ثبت آگهی همخانه</h2>

<input type="text" placeholder="نام">

<input type="number" placeholder="سن">

<input type="text" placeholder="شهر">

<select>
<option>جنسیت</option>
<option>آقا</option>
<option>خانم</option>
</select>

<textarea placeholder="توضیحات"></textarea>

<button>ثبت آگهی</button>

</div>

</body>
</html>
