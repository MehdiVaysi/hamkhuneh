<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل | همخونه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
width:350px;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
text-align:center;
}

img{
width:120px;
height:120px;
border-radius:50%;
background:#ddd;
margin-bottom:20px;
}

h2{
margin:10px 0;
color:#2e8b57;
}

p{
color:#555;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#2e8b57;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#256d46;
}
</style>

</head>

<body>

<div class="box">

<img alt="تصویر کاربر">

<h2>نام کاربر</h2>

<p>شماره موبایل</p>

<p>شهر محل سکونت</p>

<p>نوع کاربری: همخانه</p>

<button>ویرایش پروفایل</button>

</div>

</body>
  </html>
